name: Windows tests and portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python scripts/check_repository_content.py
      - run: python -m pip install pip==25.2
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows.lock
      - run: python -m pip check
      - name: Core and Tk regression with hang diagnostics
        # The growing synthetic suite + Windows filesystem variability exceeded
        # six minutes in PR #14. Keep faulthandler and print the active test.
        timeout-minutes: 10
        run: python -m pytest -vv --durations=15 -o faulthandler_timeout=60 --junitxml=test-results/pytest.xml
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name COVEXLabelManager --add-data "resources;resources" main.py
      - name: Check packaged core without altering user data
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'covex-self-check.json'
          $process = Start-Process -FilePath dist/COVEXLabelManager/COVEXLabelManager.exe -ArgumentList @('--self-check', $result) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged core check failed' }
          Copy-Item $result test-results/self-check.json
      - name: Record build and archive complete portable folder
        shell: pwsh
        run: |
          python scripts/build_manifest.py dist/COVEXLabelManager
          Compress-Archive -Path dist/COVEXLabelManager -DestinationPath COVEXLabelManager_Windows.zip
          Get-FileHash COVEXLabelManager_Windows.zip -Algorithm SHA256 | Format-List | Out-File test-results/ZIP_SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: COVEXLabelManager-Windows-${{ github.sha }}
          path: |
            COVEXLabelManager_Windows.zip
            test-results/
          retention-days: 14
          include-hidden-files: false
          if-no-files-found: error
