name: Qt editor and functional transition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'covex_label_manager/qt*'
      - 'covex_label_manager/emission_work.py'
      - 'covex_label_manager/work_tk.py'
      - 'tests/test_emission_work*.py'
      - 'covex_label_manager/qt_ui/**'
      - 'tests/test_r3a_qt.py'
      - 'tests/test_r3b1_qt.py'
      - 'tests/test_editor_layout.py'
      - 'covex_label_manager/editor_layout.py'
      - 'covex_label_manager/storage.py'
      - 'covex_label_manager/variants.py'
      - 'covex_label_manager/emission_contract.py'
      - 'covex_label_manager/schema_v4.py'
      - 'tests/test_variants_v4.py'
      - 'scripts/variant_ui_smoke.py'
      - 'requirements-qt*'
      - 'legacy_qt_bridge.py'
      - 'main_qt.py'
      - '*R3A_QT.bat'
      - '.github/workflows/r3a-qt.yml'
      - 'docs/R3A_QT_PLAN.md'
      - 'docs/R3B1_QT_EDITOR.md'
      - 'docs/FUNCTIONAL_PRESERVATION_MATRIX.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-proof:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python scripts/check_repository_content.py
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows.lock -r requirements-qt-windows.lock
      - run: python -m pip check
      - name: Regression with hang diagnostics
        timeout-minutes: 6
        run: python -m pytest -q -o faulthandler_timeout=60 --junitxml=test-results/core.xml
      - name: Interact with real Qt widgets and capture fictional windows
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python main_qt.py --capture "test-results/scale-$scale" --self-check "test-results/qt-source-$scale.json"
            if ($LASTEXITCODE -ne 0) { throw "Qt source check failed at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Exercise controlled variants and capture real synthetic UI
        run: >-
          python scripts/variant_ui_smoke.py --capture test-results/r3b2-source
          --report test-results/r3b2-source.json --verify-bridge
      - name: Exercise recoverable work and bidirectional Qt-Tk handoff
        run: >-
          python main_qt.py --work-check test-results/r3b3-source.json
          --capture test-results/r3b3-source --verify-bridge
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager_Qt
      - run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name COVEXLabelManager_Qt --exclude-module tkinter
          --add-data "covex_label_manager/qt_ui/chevron.svg;covex_label_manager/qt_ui"
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --add-data "resources;resources" main_qt.py
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager_Legacy
      - run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name COVEXLabelManager_Legacy --add-data "resources;resources"
          --exclude-module PySide6 legacy_qt_bridge.py
      - run: Copy-Item dist/COVEXLabelManager_Legacy dist/COVEXLabelManager_Qt/legacy -Recurse
      - name: Check packaged Qt UI and existing services
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
          $env:QT_SCALE_FACTOR = $scale
          $result = Join-Path $env:RUNNER_TEMP "qt-packaged-check-$scale.json"
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--self-check', $result, '--verify-bridge') -Wait -PassThru
          if (Test-Path $result) { Copy-Item $result "test-results/qt-packaged-$scale.json" }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { if (Test-Path $result) { Get-Content $result }; throw 'Packaged Qt check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or $check.count -lt 80) { throw 'Qt editor interaction check incomplete' }
          if (!$check.legacy_bridge.ok) { throw 'Legacy bridge not verified' }
          Copy-Item $result "test-results/qt-packaged-$scale.json"
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Check frozen variant selector and both bridge modes
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'r3b2-packaged.json'
          $captures = Join-Path $env:RUNNER_TEMP 'r3b2-packaged-captures'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--variant-check', $result, '--capture', $captures, '--verify-bridge') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged R3B2 variants check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or !$check.legacy_definitive_bridge.snapshot_registered) { throw 'Packaged variant contract incomplete' }
          Copy-Item $result test-results/r3b2-packaged.json
          Copy-Item $captures test-results/r3b2-packaged -Recurse
      - name: Check packaged work recovery and definitive emission
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'r3b3-packaged.json'
          $captures = Join-Path $env:RUNNER_TEMP 'r3b3-packaged-captures'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--work-check', $result, '--capture', $captures, '--verify-bridge') -Wait -PassThru
          if (Test-Path $result) { Copy-Item $result test-results/r3b3-packaged.json }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged R3B3 work check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or !$check.work_issued_once -or !$check.restart_recovered) { throw 'Packaged R3B3 contract incomplete' }
          Copy-Item $captures test-results/r3b3-packaged -Recurse
      - name: Archive proof separately from production
        shell: pwsh
        run: |
          Copy-Item docs/R3A_QT_PLAN.md dist/COVEXLabelManager_Qt/LEEME.md
          Copy-Item docs/R3B1_QT_EDITOR.md dist/COVEXLabelManager_Qt/R3B1_EDITOR.md
          Copy-Item docs/R3B3_STORAGE_SPEC.md dist/COVEXLabelManager_Qt/R3B3_WORK.md
          Copy-Item docs/R3B2_IMPLEMENTATION.md dist/COVEXLabelManager_Qt/R3B2_VARIANTS.md
          Copy-Item scripts/PROBAR_DEMO_QT.bat dist/COVEXLabelManager_Qt/
          Copy-Item docs/FUNCTIONAL_PRESERVATION_MATRIX.md dist/COVEXLabelManager_Qt/
          Compress-Archive -Path dist/COVEXLabelManager_Qt -DestinationPath COVEXLabelManager_Qt.zip
          Get-FileHash COVEXLabelManager_Qt.zip -Algorithm SHA256 | Format-List | Out-File test-results/qt-ZIP_SHA256.txt
          Get-ChildItem dist/COVEXLabelManager_Qt -Recurse -File | Measure-Object -Property Length -Sum | Format-List | Out-File test-results/qt-package-size.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3B23-Qt-Variants-Work-${{ github.sha }}
          path: |
            COVEXLabelManager_Qt.zip
            test-results/
          retention-days: 14
          if-no-files-found: error


