name: Qt editor and functional transition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'covex_label_manager/qt*'
      - 'covex_label_manager/emission*.py'
      - 'covex_label_manager/services.py'
      - 'tests/test_r3c*.py'
      - 'tests/test_r3d*.py'
      - 'tests/test_r3e*.py'
      - 'tests/test_r3f*.py'
      - 'tests/test_r4a*.py'
      - 'tests/test_r4b*.py'
      - 'tests/test_r4c*.py'
      - 'tests/test_r5*.py'
      - 'tests/test_r6*.py'
      - 'tests/test_r7a_status_qt.py'
      - 'tests/test_r7b_status_qt.py'
      - 'covex_label_manager/status_combined.py'
      - 'covex_label_manager/acceptance_preflight.py'
      - 'covex_label_manager/catalog_exchange.py'
      - 'covex_label_manager/catalog_migration.py'
      - 'covex_label_manager/master_reconciliation.py'
      - 'tests/test_r5b*.py'
      - 'covex_label_manager/print_dispatch.py'
      - 'covex_label_manager/sheet_layout.py'
      - 'covex_label_manager/layout_profiles.py'
      - 'scripts/r3e_backward_gate.py'
      - 'scripts/ux_visual_gate.py'
      - 'scripts/ux_acceptance_visual.py'
      - 'covex_label_manager/vessels.py'
      - 'covex_label_manager/engine.py'
      - 'covex_label_manager/preview_render.py'
      - 'tests/test_mass_units.py'
      - 'tests/test_preview_render.py'
      - 'scripts/verify_portable_archive.py'
      - 'tests/test_portable_archive_integrity.py'
      - 'covex_label_manager/work_tk.py'
      - 'tests/test_emission_work*.py'
      - 'covex_label_manager/qt_ui/**'
      - 'covex_label_manager/diagnostics.py'
      - 'tests/test_r8a*.py'
      - 'tests/test_r8b*.py'
      - 'tests/test_r8c*.py'
      - 'tests/test_r8d*.py'
      - 'scripts/r8d*.py'
      - 'covex_label_manager/typography.py'
      - 'covex_label_manager/status_scaling.py'
      - 'covex_label_manager/status_design.py'
      - 'covex_label_manager/status_catalog.py'
      - 'scripts/r8c*.py'
      - 'scripts/r8b_editor_visual.py'
      - 'tests/test_r3a_qt.py'
      - 'tests/test_r3b1_qt.py'
      - 'tests/test_editor_layout.py'
      - 'covex_label_manager/editor_layout.py'
      - 'covex_label_manager/storage.py'
      - 'covex_label_manager/variants.py'
      - 'covex_label_manager/emission_contract.py'
      - 'covex_label_manager/schema_v4.py'
      - 'tests/test_variants_v4.py'
      - 'scripts/variant_ui_smoke.py'
      - 'requirements-qt*'
      - 'legacy_qt_bridge.py'
      - 'main_qt.py'
      - '*R3A_QT.bat'
      - '.github/workflows/r3a-qt.yml'
      - 'docs/R3A_QT_PLAN.md'
      - 'docs/R3B1_QT_EDITOR.md'
      - 'docs/FUNCTIONAL_PRESERVATION_MATRIX.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-proof:
    runs-on: windows-2022
    # R8B adds native interactions, six before/after comparisons and checks of
    # the extracted ZIP. Budget for the extra work; per-step limits stay intact.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python scripts/check_repository_content.py
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows.lock -r requirements-qt-windows.lock
      - run: python -m pip check
      - name: Interact with real Qt widgets and capture fictional windows
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python -u -X faulthandler main_qt.py --capture "test-results/scale-$scale" --self-check "test-results/qt-source-$scale.json"
            $checkExit = $LASTEXITCODE
            Write-Host "Qt source exit code at ${scale}: $checkExit"
            $report = "test-results/qt-source-$scale.json"
            if (Test-Path $report) { Get-Content $report -Raw }
            if ($checkExit -ne 0) { throw "Qt source check failed at $scale (exit $checkExit)" }
            if (!(Test-Path $report)) { throw "Qt source report missing at $scale" }
            $check = Get-Content $report -Raw | ConvertFrom-Json
            if (!$check.ok -or $check.count -ne 86) { throw "Qt source interaction check incomplete at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Windows acceptance regressions before the full Qt suite
        timeout-minutes: 4
        run: >-
          python -m pytest -q -o faulthandler_timeout=60
          --junitxml=test-results/acceptance-fixes.xml tests/test_r6b_acceptance_fixes_qt.py
      - name: R8A privacy and native lifecycle regressions
        timeout-minutes: 3
        run: >-
          python -m pytest -q -x -o faulthandler_timeout=60
          --junitxml=test-results/r8a.xml tests/test_r8a_diagnostics.py tests/test_r8a_stability_qt.py
      - name: R8A source stability at all Windows scales and both resolutions
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python -u -X faulthandler main_qt.py --stability-check "test-results/r8a-source-$scale.json"
            if ($LASTEXITCODE -ne 0) { if (Test-Path "test-results/r8a-source-$scale.json") { Get-Content "test-results/r8a-source-$scale.json" -Raw }; throw "R8A source stability failed at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: R8B editor interaction regressions
        timeout-minutes: 3
        run: >-
          python -m pytest -q -x -o faulthandler_timeout=45
          --junitxml=test-results/r8b.xml tests/test_r8b_editor_ux_qt.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1885e235aeaf0792834403618531bad392874a3a
          path: .r8a-editor-baseline
          persist-credentials: false
      - name: R8B versus verified R8A - both viewports at all Windows scales
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          # Win32 hosted desktop caps top-level windows at about 1028 px.
          # Exact large viewports use Windows Qt offscreen rendering; all
          # native interaction/self-check steps remain on the windows backend.
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python scripts/r8b_editor_visual.py --source-root .r8a-editor-baseline --baseline --report "test-results/r8b-before-$scale.json" --capture "test-results/r8b-editor/before-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8b-before-$scale.json" -Raw; throw "R8A editor baseline failed at $scale" }
            python scripts/r8b_editor_visual.py --report "test-results/r8b-after-$scale.json" --capture "test-results/r8b-editor/after-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8b-after-$scale.json" -Raw; throw "R8B editor source failed at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - run: Remove-Item .r8a-editor-baseline -Recurse -Force
      - name: R8C real PDF and native appearance regressions
        timeout-minutes: 3
        run: >-
          python -m pytest -vv -x -o faulthandler_timeout=45
          --junitxml=test-results/r8c.xml tests/test_r8c_typography.py tests/test_r8c_typography_qt.py
      - name: R8D real guided workflow regressions
        timeout-minutes: 3
        run: >-
          python -m pytest -vv -x -o faulthandler_timeout=45
          --junitxml=test-results/r8d.xml tests/test_r8d_guided_qt.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8859f21ab77878b3e5c874bfac0023d0c8ad2ca3
          path: .r8c-guided-baseline
          persist-credentials: false
      - name: R8D measured tasks and before-after at six Windows viewport/scales
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python -u scripts/r8d_visual.py --baseline --source-root .r8c-guided-baseline --report "test-results/r8d-before-$scale.json" --capture "test-results/r8d-visual/before-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8d-before-$scale.json" -Raw; throw 'R8D baseline failed' }
            python -u scripts/r8d_visual.py --report "test-results/r8d-source-$scale.json" --capture "test-results/r8d-visual/source-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8d-source-$scale.json" -Raw; throw 'R8D source failed' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - run: Remove-Item .r8c-guided-baseline -Recurse -Force
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 56399394424896a1adbd56a91882a7eb49282632
          path: .r8b-typography-baseline
          persist-credentials: false
      - name: R8C before-after, real PDF geometry and unchanged historical rasters
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python scripts/r8c_visual.py --baseline --source-root .r8b-typography-baseline --report "test-results/r8c-before-$scale.json" --capture "test-results/r8c-visual/before-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8c-before-$scale.json" -Raw; throw 'R8C baseline failed' }
            python scripts/r8c_visual.py --report "test-results/r8c-source-$scale.json" --capture "test-results/r8c-visual/source-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r8c-source-$scale.json" -Raw; throw 'R8C source failed' }
            python scripts/r8c_compare_evidence.py --before "test-results/r8c-before-$scale.json" --after "test-results/r8c-source-$scale.json" --report "test-results/r8c-comparison-$scale.json"
            if ($LASTEXITCODE -ne 0) { throw 'R8C historical PDF changed or evidence incomplete' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
          python scripts/r8c_backward_gate.py --previous-source .r8b-typography-baseline --report test-results/r8c-backward.json
          if ($LASTEXITCODE -ne 0) { throw 'R8B reader silently accepted R8C semantics' }
      - run: Remove-Item .r8b-typography-baseline -Recurse -Force
      - name: Native emission, history and reprint on actual Qt
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python -u -X faulthandler main_qt.py --emission-check "test-results/r3c-source-$scale.json" --capture "test-results/r3c-source-$scale"
            if ($LASTEXITCODE -ne 0) { if (Test-Path "test-results/r3c-source-$scale.json") { Get-Content "test-results/r3c-source-$scale.json" -Raw }; throw "R3C native source failed at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: R7B-AC1 real Qt status library and editor acceptance (fail fast)
        timeout-minutes: 3
        run: >-
          python -m pytest -q -x -o faulthandler_timeout=45
          tests/test_r7a_status_qt.py tests/test_r7b_status_qt.py
      - name: Qt and migration-consent regression (core/Tk covered in Windows job)
        timeout-minutes: 8
        run: >-
          python -m pytest -vv --durations=15 -o faulthandler_timeout=60 --junitxml=test-results/qt.xml
          tests/test_r3a_qt.py tests/test_r3b1_qt.py tests/test_emission_work_qt.py
          tests/test_r3c_emission_qt.py tests/test_r3c_history_qt.py tests/test_r3d_settings_qt.py
          tests/test_migration_consent.py tests/test_r3e_layout.py tests/test_r3e_qt.py tests/test_r3f_qt.py
          tests/test_r4a_layout.py tests/test_r4a_qt.py tests/test_r4b_calibration.py tests/test_r4b_qt.py
          tests/test_r4c_dispatch.py tests/test_r4c_qt.py tests/test_r5a_catalog.py
          tests/test_r5b_migration.py tests/test_r5c_reconciliation.py tests/test_r5c_qt.py
          tests/test_r6a_acceptance.py tests/test_r6a_qt.py
          tests/test_r6b_session.py tests/test_r6b_qt.py tests/test_r6b_ux_qt.py
          tests/test_mass_units.py
          tests/test_preview_render.py tests/test_r7a_status_qt.py tests/test_r7b_status_qt.py
      - name: Importer close process regression at three native Windows scales
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = "test-results/import-source-$scale.json"
            python -u -X faulthandler main_qt.py --import-check $report
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $report)) { throw "Importer process failed at $scale" }
            $check = Get-Content $report -Raw | ConvertFrom-Json
            if (!$check.ok -or $check.cases.Count -ne 18) { throw "Importer close coverage incomplete at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 46d3eab93381a81bae47f04ffe367334c8f16709
          path: .ux-before-source
          persist-credentials: false
      - name: Synthetic acceptance before and after at six Windows viewport/scales
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            foreach ($viewport in @(@(1366, 768), @(1920, 1080))) {
              python scripts/ux_acceptance_visual.py --baseline --source-root .ux-before-source --width $viewport[0] --height $viewport[1]
              if ($LASTEXITCODE -ne 0) { throw "Baseline capture failed at $scale / $viewport" }
              python scripts/ux_acceptance_visual.py --width $viewport[0] --height $viewport[1]
              if ($LASTEXITCODE -ne 0) { throw "Acceptance capture failed at $scale / $viewport" }
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR
          Remove-Item .ux-before-source -Recurse -Force
      - name: R6B integrated UX at both viewports and three Qt scales
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            foreach ($viewport in @(@(1366, 768), @(1920, 1080))) {
              $viewportWidth = $viewport[0]
              $viewportHeight = $viewport[1]
              python scripts/ux_visual_gate.py --width $viewportWidth --height $viewportHeight
              if ($LASTEXITCODE -ne 0) { throw "Integrated UX failed at $scale / $viewport" }
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Exercise controlled variants and capture real synthetic UI
        run: >-
          python scripts/variant_ui_smoke.py --capture test-results/r3b2-source
          --report test-results/r3b2-source.json --verify-bridge
      - name: Exercise recoverable work and bidirectional Qt-Tk handoff
        run: >-
          python main_qt.py --work-check test-results/r3b3-source.json
          --capture test-results/r3b3-source --verify-bridge
      - name: R3E visual design proof on native Qt
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            python main_qt.py --r3e-check "test-results/r3e-source-$scale.json" --capture "test-results/r3e-source-$scale"
            if ($LASTEXITCODE -ne 0) { Get-Content "test-results/r3e-source-$scale.json"; throw 'R3E source check failed' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 46314a4b83c51e5cc45cccfce4c50925a59a8bfe
          path: .r3d-compatibility
          persist-credentials: false
      - name: Unchanged R3D readers reject new work and snapshots
        run: python scripts/r3e_backward_gate.py --previous-source .r3d-compatibility
      - run: Remove-Item .r3d-compatibility -Recurse -Force
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager_Qt
      - run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed --disable-windowed-traceback
          --name COVEXLabelManager_Qt --exclude-module tkinter
          --add-data "covex_label_manager/qt_ui/chevron.svg;covex_label_manager/qt_ui"
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --add-data "resources;resources" main_qt.py
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager_Legacy
      - run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed --disable-windowed-traceback
          --name COVEXLabelManager_Legacy --add-data "resources;resources"
          --exclude-module PySide6 legacy_qt_bridge.py
      - run: Copy-Item dist/COVEXLabelManager_Legacy dist/COVEXLabelManager_Qt/legacy -Recurse
      - name: Check packaged Qt UI and existing services
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
          $env:QT_SCALE_FACTOR = $scale
          $result = Join-Path $env:RUNNER_TEMP "qt-packaged-check-$scale.json"
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--self-check', $result, '--verify-bridge') -Wait -PassThru
          if (Test-Path $result) { Copy-Item $result "test-results/qt-packaged-$scale.json" }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { if (Test-Path $result) { Get-Content $result }; throw 'Packaged Qt check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or $check.count -lt 80) { throw 'Qt editor interaction check incomplete' }
          if (!$check.legacy_bridge.ok) { throw 'Legacy bridge not verified' }
          Copy-Item $result "test-results/qt-packaged-$scale.json"
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Frozen importer closes without quitting the application
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $result = Join-Path $env:RUNNER_TEMP "import-frozen-$scale.json"
            $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--import-check', $result) -Wait -PassThru
            if (Test-Path $result) { Copy-Item $result "test-results/import-frozen-$scale.json" }
            if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw "Frozen importer failed at $scale" }
            $check = Get-Content $result -Raw | ConvertFrom-Json
            if (!$check.ok -or $check.cases.Count -ne 18) { throw "Frozen importer coverage incomplete at $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Check frozen variant selector and both bridge modes
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'r3b2-packaged.json'
          $captures = Join-Path $env:RUNNER_TEMP 'r3b2-packaged-captures'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--variant-check', $result, '--capture', $captures, '--verify-bridge') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged R3B2 variants check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or !$check.legacy_definitive_bridge.snapshot_registered) { throw 'Packaged variant contract incomplete' }
          Copy-Item $result test-results/r3b2-packaged.json
          Copy-Item $captures test-results/r3b2-packaged -Recurse
      - name: Check packaged work recovery and definitive emission
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'r3b3-packaged.json'
          $captures = Join-Path $env:RUNNER_TEMP 'r3b3-packaged-captures'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--work-check', $result, '--capture', $captures, '--verify-bridge') -Wait -PassThru
          if (Test-Path $result) { Copy-Item $result test-results/r3b3-packaged.json }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged R3B3 work check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or !$check.work_issued_once -or !$check.restart_recovered) { throw 'Packaged R3B3 contract incomplete' }
          Copy-Item $captures test-results/r3b3-packaged -Recurse
      - name: Check frozen native emission and history without Tk
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'r3c-packaged.json'
          $captures = Join-Path $env:RUNNER_TEMP 'r3c-packaged-captures'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--emission-check', $result, '--capture', $captures) -Wait -PassThru
          if (Test-Path $result) { Copy-Item $result test-results/r3c-packaged.json }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { if (Test-Path $result) { Get-Content $result -Raw }; throw 'Packaged R3C native emission failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or $check.count -lt 31) { throw 'Packaged R3C contract incomplete' }
          Copy-Item $captures test-results/r3c-packaged -Recurse
      - name: R3E frozen portable interaction and captures
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $result = Join-Path $env:RUNNER_TEMP "r3e-frozen-$scale.json"
            $captures = Join-Path $env:RUNNER_TEMP "r3e-frozen-$scale"
            $process = Start-Process -FilePath dist/COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe -ArgumentList @('--r3e-check', $result, '--capture', $captures) -Wait -PassThru
            if (Test-Path $result) { Copy-Item $result "test-results/r3e-frozen-$scale.json" }
            if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'R3E portable check failed' }
            $check = Get-Content $result -Raw | ConvertFrom-Json
            if (!$check.ok) { Get-Content $result; throw 'R3E portable acceptance failed' }
            Copy-Item $captures "test-results/r3e-frozen-$scale" -Recurse
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Archive proof separately from production
        shell: pwsh
        run: |
          Copy-Item docs/R3E_IMPLEMENTATION_REPORT.md dist/COVEXLabelManager_Qt/R3E_IMPLEMENTATION_REPORT.md
          Copy-Item docs/R3E_IMPLEMENTATION_SPEC.md dist/COVEXLabelManager_Qt/R3E_IMPLEMENTATION_SPEC.md
          Copy-Item docs/R3A_QT_PLAN.md dist/COVEXLabelManager_Qt/LEEME.md
          Copy-Item docs/R3B1_QT_EDITOR.md dist/COVEXLabelManager_Qt/R3B1_EDITOR.md
          Copy-Item docs/R3C_IMPLEMENTATION.md dist/COVEXLabelManager_Qt/R3C_EMISSION.md
          Copy-Item docs/R3C_PARITY.md dist/COVEXLabelManager_Qt/R3C_PARITY.md
          Copy-Item docs/R3B3_IMPLEMENTATION.md dist/COVEXLabelManager_Qt/R3B3_IMPLEMENTATION.md
          Copy-Item docs/R3B3_STORAGE_SPEC.md dist/COVEXLabelManager_Qt/R3B3_WORK.md
          Copy-Item docs/R3B2_IMPLEMENTATION.md dist/COVEXLabelManager_Qt/R3B2_VARIANTS.md
          Copy-Item scripts/PROBAR_DEMO_QT.bat dist/COVEXLabelManager_Qt/
          Copy-Item docs/FUNCTIONAL_PRESERVATION_MATRIX.md dist/COVEXLabelManager_Qt/
          Copy-Item docs/R6B_UX_INTEGRATED/PRUEBAS_Y_PORTABLE.md dist/COVEXLabelManager_Qt/GUIA_R6B_UX.md
          Copy-Item docs/R6B_UX_INTEGRATED/CORRECCIONES_ACEPTACION.md dist/COVEXLabelManager_Qt/
          Copy-Item docs/R6B_UX_INTEGRATED/CONSERVACION_87.md dist/COVEXLabelManager_Qt/
          Copy-Item docs/R6B_UX_INTEGRATED/CI_QT_FIX.md dist/COVEXLabelManager_Qt/
          Copy-Item docs/R8A_STABILITY_DIAGNOSTICS.md dist/COVEXLabelManager_Qt/
          Copy-Item docs/R8C_TYPOGRAPHY_SCALING/README.md dist/COVEXLabelManager_Qt/GUIA_R8C.md
          Copy-Item docs/R8C_TYPOGRAPHY_SCALING/URW-FONTS-OFL.txt dist/COVEXLabelManager_Qt/
          Copy-Item docs/R8D_GUIDED_WORKFLOW/README.md dist/COVEXLabelManager_Qt/GUIA_R8D.md
