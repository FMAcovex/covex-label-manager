          python scripts/build_manifest.py dist/COVEXLabelManager_Qt
          if ($LASTEXITCODE -ne 0) { throw 'Qt build manifest failed' }
          Compress-Archive -Path dist/COVEXLabelManager_Qt -DestinationPath COVEXLabelManager_Qt.zip
          python scripts/verify_portable_archive.py COVEXLabelManager_Qt.zip --report test-results/qt-archive-integrity.json
          if ($LASTEXITCODE -ne 0) { throw 'Qt archive integrity failed' }
          Get-FileHash COVEXLabelManager_Qt.zip -Algorithm SHA256 | Format-List | Out-File test-results/qt-ZIP_SHA256.txt
          Get-ChildItem dist/COVEXLabelManager_Qt -Recurse -File | Measure-Object -Property Length -Sum | Format-List | Out-File test-results/qt-package-size.txt
      - name: R8A extracted acceptance ZIP stability at all scales
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP ('r8a-extracted-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -Path COVEXLabelManager_Qt.zip -DestinationPath $extracted
          $executable = Join-Path $extracted 'COVEXLabelManager_Qt/COVEXLabelManager_Qt.exe'
          "R8B_EXTRACTED_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = Join-Path $pwd "test-results/r8a-extracted-$scale.json"
            $process = Start-Process -FilePath $executable -ArgumentList @('--stability-check', $report) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { if (Test-Path $report) { Get-Content $report -Raw }; throw "R8A extracted stability failed at $scale" }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (!$result.ok -or $result.cycles -lt 8 -or !$result.sqlite_integrity -or !$result.normal_start_close -or !$result.diagnostic_export_private) { Get-Content $report -Raw; throw 'R8A extracted contract incomplete' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: R8B editor in the actual extracted portable at all Windows scales
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $executable = $env:R8B_EXTRACTED_EXE
          if (!$executable -or !(Test-Path $executable)) { throw 'Extracted acceptance executable missing' }
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = Join-Path $pwd "test-results/r8b-extracted-$scale.json"
            $captures = Join-Path $pwd "test-results/r8b-editor/extracted-$scale"
            $process = Start-Process -FilePath $executable -ArgumentList @('--editor-ux-check', $report, '--capture', $captures) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { if (Test-Path $report) { Get-Content $report -Raw }; throw "R8B extracted editor failed at $scale" }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (!$result.ok -or !$result.integrity -or !$result.exact_viewports -or $result.os -ne 'win32' -or $result.qt_platform -ne 'offscreen' -or !$result.approved_revision_unchanged -or $result.captures.Count -ne 14) { Get-Content $report -Raw; throw 'R8B extracted contract incomplete' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: R8C fonts, appearance safety and scaling in the actual extracted ZIP
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $executable = $env:R8B_EXTRACTED_EXE
          if (!$executable -or !(Test-Path $executable)) { throw 'Extracted acceptance executable missing' }
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = Join-Path $pwd "test-results/r8c-extracted-$scale.json"
            $captures = Join-Path $pwd "test-results/r8c-visual/extracted-$scale"
            $process = Start-Process -FilePath $executable -ArgumentList @('--typography-check', $report, '--capture', $captures) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { if (Test-Path $report) { Get-Content $report -Raw }; throw 'R8C extracted check failed' }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (!$result.ok -or !$result.integrity -or !$result.sqlite_v4 -or !$result.exact_viewports -or !$result.approved_revision_unchanged -or !$result.trial_production_blocked -or !$result.status_exact_reprint -or !$result.critical_crop_blocked -or !$result.italic_ink_checked -or !$result.literal_spaces_checked -or $result.embedded_fonts -ne 12 -or $result.combined_cases -ne 6 -or $result.legacy_compositions -ne 3 -or $result.captures.Count -ne 12 -or $result.os -ne 'win32') { Get-Content $report -Raw; throw 'R8C extracted coverage incomplete' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      # User-facing download: application only, no screenshots or CI reports.
      # Technical evidence is a separate download, not a second portable.
      - name: R8D guided tasks in the actual extracted portable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($scale in @('1', '1.25', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = Join-Path $pwd "test-results/r8d-extracted-$scale.json"
            $captures = Join-Path $pwd "test-results/r8d-visual/extracted-$scale"
            $process = Start-Process -FilePath $env:R8B_EXTRACTED_EXE -ArgumentList @('--guided-check', $report, '--capture', $captures) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { if (Test-Path $report) { Get-Content $report -Raw }; throw 'R8D extracted check failed' }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (!$result.ok -or !$result.four_steps -or !$result.same_work -or !$result.normal_start_close -or !$result.integrity -or !$result.sqlite_v4 -or !$result.exact_viewports -or !$result.approved_revision_unchanged -or !$result.registered_pdf_verified -or !$result.reprint_verified -or $result.captures.Count -ne 14 -or $result.tasks.Count -ne 10 -or $result.os -ne 'win32') { Get-Content $report -Raw; throw 'R8D extracted coverage incomplete' }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Publish lightweight Qt portable without test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
