name: R3B2 migration safety gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e83953b023a6c40702a276745a1fcaeae278dbd1
          path: .legacy-r3b1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows.lock -r requirements-qt-windows.lock
      - run: python -m pytest -q tests/test_migration_v4.py --junitxml=test-results/migration.xml
      - name: Build the unchanged previous Tk entrypoint
        working-directory: .legacy-r3b1
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console --name PreviousTk
          --exclude-module PySide6 --add-data "resources;resources" main.py
      - name: Build the unchanged previous Qt entrypoint
        working-directory: .legacy-r3b1
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console --name PreviousQt
          --exclude-module tkinter --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --add-data "resources;resources" main_qt.py
      - name: Abrupt-process recovery and old source/EXE writer rejection
        run: >-
          python scripts/migration_gate.py --legacy-source .legacy-r3b1
          --legacy-tk .legacy-r3b1/dist/PreviousTk/PreviousTk.exe
          --legacy-qt .legacy-r3b1/dist/PreviousQt/PreviousQt.exe
          --report test-results/migration-gate-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3B2-migration-safety-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error
