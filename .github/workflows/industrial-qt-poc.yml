name: Industrial Qt visual proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prototypes/**'
      - 'qt_visual_poc.py'
      - '*PRUEBA_QT.bat'
      - '.github/workflows/industrial-qt-poc.yml'
permissions:
  contents: read
jobs:
  visual-proof:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python scripts/check_repository_content.py
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows.lock -r prototypes/industrial_qt/requirements-windows.lock
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=test-results/core.xml
      - name: Interact with real Qt widgets and capture fictional windows
        run: python qt_visual_poc.py --capture test-results/industrial-qt --self-check test-results/qt-source.json
      - run: python scripts/check_build_destination.py dist/COVEXLabelManager_Visual_Qt
      - run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name COVEXLabelManager_Visual_Qt --exclude-module tkinter
          --add-data "prototypes/industrial_qt/chevron.svg;prototypes/industrial_qt"
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick qt_visual_poc.py
      - name: Check packaged Qt UI and existing services
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'qt-packaged-check.json'
          $process = Start-Process -FilePath dist/COVEXLabelManager_Visual_Qt/COVEXLabelManager_Visual_Qt.exe -ArgumentList @('--self-check', $result) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged Qt check failed' }
          $check = Get-Content $result -Raw | ConvertFrom-Json
          if (!$check.ok -or $check.count -lt 22) { throw 'Qt interaction check incomplete' }
          Copy-Item $result test-results/qt-packaged.json
      - name: Archive proof separately from production
        shell: pwsh
        run: |
          Copy-Item docs/INDUSTRIAL_QT_POC.md dist/COVEXLabelManager_Visual_Qt/LEEME.md
          Copy-Item docs/FUNCTIONAL_PRESERVATION_MATRIX.md dist/COVEXLabelManager_Visual_Qt/
          Compress-Archive -Path dist/COVEXLabelManager_Visual_Qt -DestinationPath COVEXLabelManager_Visual_Qt.zip
          Get-FileHash COVEXLabelManager_Visual_Qt.zip -Algorithm SHA256 | Format-List | Out-File test-results/qt-ZIP_SHA256.txt
          Get-ChildItem dist/COVEXLabelManager_Visual_Qt -Recurse -File | Measure-Object -Property Length -Sum | Format-List | Out-File test-results/qt-package-size.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Industrial-Qt-Visual-Proof-${{ github.sha }}
          path: |
            COVEXLabelManager_Visual_Qt.zip
            test-results/
          retention-days: 14
          if-no-files-found: error
